name: Build Wine pack

# Manually triggered: builds dist/wine-pack.tgz (Wine 11.20 wow64 +
# x86_64 system libraries for Box64) and publishes it as a release
# asset. The app downloads this pack on demand — it is NOT in the APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wine-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Wine pack
        run: bash scripts/make-wine-pack.sh

      - name: Publish pack to "wine-pack-11.20" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wine-pack-11.20
          name: Wine pack 11.20 (engine download)
          prerelease: true
          files: dist/wine-pack.tgz
