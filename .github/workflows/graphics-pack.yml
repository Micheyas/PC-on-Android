name: Build Graphics pack

# Manually triggered: builds dist/graphics-pack.tgz (Xvfb + x11vnc +
# their full arm64 dependency closure from Ubuntu noble, extracted
# raw — no guest network needed) and publishes it as a release asset.
# The app downloads this pack on demand — it is NOT in the APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graphics-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Graphics pack
        run: bash scripts/make-graphics-pack.sh

      - name: Publish pack to "graphics-pack-2" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: graphics-pack-2
          name: Graphics pack 2 (X server download, merged-usr safe)
          prerelease: true
          files: dist/graphics-pack.tgz
