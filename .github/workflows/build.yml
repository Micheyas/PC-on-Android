name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch engine 2 assets (Ubuntu rootfs + Box64)
        run: bash scripts/fetch-engine2.sh

      - name: Fetch test programs (plink.exe console + putty.exe windowed)
        run: |
          for i in 1 2 3 4 5; do
            curl -fL -o app/src/main/assets/plink.exe https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe && break
            sleep 3
          done
          for i in 1 2 3 4 5; do
            curl -fL -o app/src/main/assets/putty.exe https://the.earth.li/~sgtatham/putty/latest/w64/putty.exe && break
            sleep 3
          done
          ls -lh app/src/main/assets/plink.exe app/src/main/assets/putty.exe

      - name: Restore fixed signing keystore (stable signature across builds)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing-ci"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/signing-ci/debug.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing-ci/debug.keystore" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/signing-ci/debug.keystore"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
